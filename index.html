<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YetAnotherSSHClient</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
    </style>
    <script>
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        let theme = urlParams.get('theme') || localStorage.getItem('last-theme') || 'Light';

        if (theme === 'Auto') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light';
        }

        const themeClass = theme.toLowerCase().replace(' ', '-');

        const colors = {
          'dark': { bg: '#0F172A', text: '#E2E8F0' },
          'windows-terminal': { bg: '#0C0C0C', text: '#CCCCCC' },
          'gruvbox-light': { bg: '#fbf1c7', text: '#3c3836' },
          'gruvbox-dark': { bg: '#282828', text: '#ebdbb2' },
          'light': { bg: '#F8FAFC', text: '#0F172A' }
        };

        const config = colors[themeClass] || (themeClass.includes('dark') ? colors['dark'] : colors['light']);

        document.documentElement.className = themeClass;
        document.documentElement.style.backgroundColor = config.bg;
        document.documentElement.style.color = config.text;
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        let theme = urlParams.get('theme') || localStorage.getItem('last-theme') || 'Light';
        if (theme === 'Auto') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light';
        }
        document.body.className = theme.toLowerCase().replace(' ', '-');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
