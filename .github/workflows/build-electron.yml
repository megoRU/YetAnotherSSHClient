name: Build/Release Electron App (legacy)

# Сборка прежней Electron-реализации. Оставлена на время миграции: ветка
# `dev-v4.0.0` собирается в `build-tauri.yml`, а этот workflow позволяет
# собрать и сравнить старую версию без переключения ветки.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:electron -- --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: release/**
