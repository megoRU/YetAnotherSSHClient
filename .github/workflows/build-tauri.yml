name: Build/Release Tauri App

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building $VERSION"

  build:
    name: ${{ matrix.os }}
    needs: resolve
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64

          - os: windows-latest
            platform: windows-x86_64

          - os: macos-15
            platform: darwin-aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            file \
            wget \
            curl

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run icons:tauri

      - name: Prepare updater configuration
        env:
          TAURI_UPDATER_ENABLED: ${{ vars.TAURI_UPDATER_ENABLED }}
          # Публичный ключ НЕ передаётся: он и так лежит в
          # src-tauri/tauri.conf.json (plugins.updater.pubkey) и оттуда
          # попадает в приложение. Держать его в секретах значило бы завести
          # второй источник истины: при смене ключа они разойдутся, сборка
          # пройдёт, а подпись окажется чужой — и обновление молча не
          # установится.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/gen-updater-config.mjs

      - name: Build application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLES="${{ matrix.platform == 'windows-x86_64' && 'nsis' || matrix.platform == 'darwin-aarch64' && 'app,dmg' || 'deb,rpm,appimage' }}"

          if [ "${{ vars.TAURI_UPDATER_ENABLED }}" = "true" ]; then
            npm run tauri -- build \
              --config src-tauri/tauri.updater.generated.json \
              --ci \
              --bundles "$BUNDLES"
          else
            npm run tauri -- build \
              --ci \
              --bundles "$BUNDLES"
          fi

      # ------------------------------------------------------------
      # Updater manifest fragment
      # ------------------------------------------------------------

      - name: Generate updater manifest fragment
        if: vars.TAURI_UPDATER_ENABLED == 'true'
        shell: bash
        env:
          TAURI_UPDATER_VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_UPDATER_TAG: ${{ needs.resolve.outputs.tag }}
          TAURI_UPDATER_PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/gen-updater-manifest.mjs fragment

      - name: Upload updater fragment
        if: vars.TAURI_UPDATER_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: updater-fragment-${{ matrix.platform }}
          path: src-tauri/updater/fragments/fragment-${{ matrix.platform }}.json

      # ------------------------------------------------------------
      # Prepare release artifacts
      # ------------------------------------------------------------

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          echo "Collecting release artifacts..."

          # ----------------------------------------------------------
          # Windows
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then

            # Tauri 2 не создаёт .nsis.zip: автообновление на Windows
            # использует сам NSIS-установщик, поэтому копируем .exe и .exe.sig.
            EXE="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*x64-setup.exe' \
              | head -n 1)"

            EXE_SIG="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*x64-setup.exe.sig' \
              | head -n 1)"

            test -n "$EXE"
            cp "$EXE" release/YASSH-Client-windows-x64.exe

            if [ -n "$EXE_SIG" ]; then
              cp "$EXE_SIG" release/YASSH-Client-windows-x64.exe.sig
            else
              echo "Нет подписи .exe.sig — Windows не получит автообновление"
            fi

          fi

          # ----------------------------------------------------------
          # macOS
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "darwin-aarch64" ]; then

            DMG="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*.dmg' \
              | head -n 1)"

            test -n "$DMG"
            cp "$DMG" release/YASSH-Client-macos-arm64.dmg

            if [ "${{ vars.TAURI_UPDATER_ENABLED }}" = "true" ]; then

              APP_TAR="$(find src-tauri/target/release/bundle \
                -type f \
                -name '*.app.tar.gz' \
                | head -n 1)"

              APP_TAR_SIG="$(find src-tauri/target/release/bundle \
                -type f \
                -name '*.app.tar.gz.sig' \
                | head -n 1)"

              test -n "$APP_TAR"
              test -n "$APP_TAR_SIG"

              cp "$APP_TAR" \
                release/YASSH-Client-macos-arm64.app.tar.gz

              cp "$APP_TAR_SIG" \
                release/YASSH-Client-macos-arm64.app.tar.gz.sig
            fi

          fi

          # ----------------------------------------------------------
          # Linux
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then

            DEB="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*.deb' \
              | head -n 1)"

            RPM="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*.rpm' \
              | head -n 1)"

            APPIMAGE="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*.AppImage' \
              | head -n 1)"

            APPIMAGE_SIG="$(find src-tauri/target/release/bundle \
              -type f \
              -name '*.AppImage.sig' \
              | head -n 1)"

            test -n "$DEB"
            test -n "$RPM"
            test -n "$APPIMAGE"

            cp "$DEB" release/YASSH-Client-linux-amd64.deb
            cp "$RPM" release/YASSH-Client-linux-x86_64.rpm
            cp "$APPIMAGE" release/YASSH-Client-linux-amd64.AppImage

            if [ -n "$APPIMAGE_SIG" ]; then
              cp "$APPIMAGE_SIG" \
                release/YASSH-Client-linux-amd64.AppImage.sig
            fi

          fi

          echo ""
          echo "Files prepared for artifact transfer:"
          echo ""

          find release \
            -maxdepth 1 \
            -type f \
            -exec basename {} \; \
            | sort

      # ------------------------------------------------------------
      # Upload selected files
      # ------------------------------------------------------------

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.platform }}
          path: release/*

  updater-manifest:
    name: Updater manifest
    needs:
      - resolve
      - build

    runs-on: ubuntu-24.04

    if: vars.TAURI_UPDATER_ENABLED == 'true' && needs.build.result != 'failure' && needs.build.result != 'cancelled'

    permissions:
      contents: read

    steps:
      # Checkout нужен только ради `scripts/gen-updater-manifest.mjs`: фрагменты
      # приезжают артефактом, а манифест из них собирается уже в этом job.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          path: src-tauri/updater/fragments
          pattern: updater-fragment-*
          merge-multiple: true

      - name: Merge updater manifest
        shell: bash
        env:
          TAURI_UPDATER_VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_UPDATER_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node scripts/gen-updater-manifest.mjs merge

      # Манифест в ветку не коммитится: он публикуется ассетом релиза, а
      # приложение читает `releases/latest/download/latest.json`. Коммит в
      # ветку успевал указать на тег, которого ещё нет, и приводил к 404 при
      # скачивании — то есть к состоянию «обновление есть, а поставить нельзя».
      - name: Upload updater manifest
        uses: actions/upload-artifact@v6
        with:
          name: updater-manifest
          path: |
            src-tauri/updater/latest.json

  draft-release:
    name: Draft release
    needs:
      - resolve
      - build
      - updater-manifest

    runs-on: ubuntu-24.04

    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.updater-manifest.result != 'failure'

    permissions:
      contents: write

    # `gh` определяет репозиторий через git, а checkout в этом job намеренно
    # нет: собирать тут нечего, только склеиваются артефакты предыдущих job'ов.
    # Без явного `GH_REPO` любой вызов `gh` падал с
    # «fatal: not a git repository», потому что искать репозиторий негде.
    # Раньше это молча ломало удаление старого draft'а: `gh release view` был
    # завёрнут в `if ! ... 2>&1`, и шаг «успешно» выходил, ничего не сделав.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Download updater manifest
        if: needs.updater-manifest.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: updater-manifest
          path: manifest

      - name: Prepare final release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          find bundles \
            -type f \
            \( \
              -name '*.exe' \
              -o -name '*.exe.sig' \
              -o -name '*.dmg' \
              -o -name '*.app.tar.gz' \
              -o -name '*.app.tar.gz.sig' \
              -o -name '*.deb' \
              -o -name '*.rpm' \
              -o -name '*.AppImage' \
              -o -name '*.AppImage.sig' \
            \) \
            -exec cp {} release/ \;

          if [ -f manifest/latest.json ]; then
            cp manifest/latest.json release/latest.json
          elif [ "${{ vars.TAURI_UPDATER_ENABLED }}" = "true" ]; then
            # Подпись включена, а манифест не собрался: релиз получился бы
            # невидимым для приложения, и пользователь остался бы на старой
            # версии без объяснений. Лучше остановить публикацию.
            echo "::error::Манифест обновлений не собран — публикуем релиз, который приложение не сможет предложить"
            exit 1
          else
            echo "Автообновление выключено — публикуем релиз без манифеста"
          fi

          echo ""
          echo "FINAL GITHUB RELEASE FILES:"
          echo ""

          find release \
            -maxdepth 1 \
            -type f \
            -exec basename {} \; \
            | sort

          echo ""
          echo "Total files:"

          find release \
            -maxdepth 1 \
            -type f \
            | wc -l

      - name: Remove previous draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Вывод `gh` не глушится: иначе сбой авторизации или контекста
          # репозитория выглядел бы как «релиза ещё нет» и шаг проходил,
          # ничего не сделав. Отсутствие релиза — единственный случай, когда
          # продолжать нечего, и он проверяется отдельно по коду возврата
          # самого `gh`.
          if ! VIEW="$(gh release view "$TAG" --json isDraft 2>&1)"; then
            if printf '%s' "$VIEW" | grep -qi "release not found"; then
              echo "Релиза $TAG ещё нет"
              exit 0
            fi

            echo "::error::Не удалось прочитать релиз $TAG: $VIEW"
            exit 1
          fi

          IS_DRAFT="$(printf '%s' "$VIEW" | jq -r .isDraft)"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Релиз $TAG уже опубликован — не трогаю"
            exit 0
          fi

          echo "Удаляю старый draft release $TAG"

          gh release delete "$TAG" \
            --yes \
            --cleanup-tag

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}

          # Заголовок — только версия.
          name: ${{ needs.resolve.outputs.version }}

          draft: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}

          # Pre-release в смысле GitHub не ставится никогда, и это не
          # опечатка. Приложение читает манифест по адресу
          # `releases/latest/download/latest.json`, а `releases/latest` по
          # определению игнорирует draft- и pre-release-релизы. Пометив сборку
          # 4.0.1-rc.3 как pre-release, мы бы навсегда оставили всех на 4.0.0:
          # адрес так и указывал бы на старый релиз. Отсекать rc от
          # пользователя со стабильной сборкой должно приложение — по
          # настройке «Получать Beta обновления».
          prerelease: false

          target_commitish: ${{ github.sha }}

          fail_on_unmatched_files: false

          # Тело релиза — только заголовок блока. Сам текст «Что нового» в сборке
          # не хранится: приложение берёт его через GitHub API
          # (`fetchReleaseNotesFromGithub`), поэтому в манифест поле `notes`
          # не пишется — иначе приложение показало бы заглушку и до API не
          # дошло бы. Текст дописывается на странице релиза при публикации.
          body: |
            ## Что нового

          files: |
            release/*.exe
            release/*.exe.sig
            release/*.dmg
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.AppImage.sig
            release/latest.json

      # `softprops/action-gh-release` умеет только включать `prerelease`, но не
      # выключать. Если релиз по этому тегу уже существовал (черновик от
      # прошлого прогона), флаг сохранялся — и `releases/latest` продолжал
      # указывать на старый релиз, а адрес манифеста отдавал 404.
      - name: Normalize release flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$TAG" --prerelease=false

      # Релиз с пре-релизом в версии публикуется сразу, независимо от того,
      # запущен ли workflow пушем или вручную. Пока он в статусе draft, его
      # файлы анонимно не скачиваются и `releases/latest` на него не указывает —
      # то есть обновление невозможно. Стабильные версии остаются черновиками
      # (условие шага не срабатывает) и публикуются вручную после проверки.
      #
      # Флаг `--prerelease` здесь намеренно не ставится: приложение читает
      # манифест через `releases/latest`, а GitHub исключает из `latest`
      # pre-release-релизы. Пометив релиз как pre-release, мы бы оставили всех
      # пользователей на предыдущей версии навсегда.
      - name: Publish release
        if: contains(needs.resolve.outputs.version, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Публикую релиз $TAG"
          gh release edit "$TAG" --draft=false