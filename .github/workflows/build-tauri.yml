name: Build/Release Tauri App

on:
  push:
    branches:
      - dev-v4.0.0

  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building $VERSION"

  build:
    name: ${{ matrix.os }}
    needs: resolve
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64

          - os: windows-latest
            platform: windows-x86_64

          - os: macos-15
            platform: darwin-aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            file \
            wget \
            curl

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run icons:tauri

      - name: Prepare updater configuration
        env:
          TAURI_UPDATER_ENABLED: ${{ vars.TAURI_UPDATER_ENABLED }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/gen-updater-config.mjs

      - name: Build application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLES="${{ matrix.platform == 'windows-x86_64' && 'nsis' || matrix.platform == 'darwin-aarch64' && 'app' || 'deb,rpm,appimage' }}"

          if [ "${{ vars.TAURI_UPDATER_ENABLED }}" = "true" ]; then
            npm run tauri -- build \
              --config src-tauri/tauri.updater.generated.json \
              --ci \
              --bundles "$BUNDLES"
          else
            npm run tauri -- build \
              --ci \
              --bundles "$BUNDLES"
          fi

      # ------------------------------------------------------------
      # Updater manifest fragment
      # ------------------------------------------------------------

      - name: Generate updater manifest fragment
        if: vars.TAURI_UPDATER_ENABLED == 'true'
        shell: bash
        env:
          TAURI_UPDATER_VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_UPDATER_TAG: ${{ needs.resolve.outputs.tag }}
          TAURI_UPDATER_PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/gen-updater-manifest.mjs fragment

      - name: Upload updater fragment
        if: vars.TAURI_UPDATER_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: updater-fragment-${{ matrix.platform }}
          path: src-tauri/updater/fragments/fragment-${{ matrix.platform }}.json

      # ------------------------------------------------------------
      # Prepare ONLY release files
      # ------------------------------------------------------------

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          echo "Collecting release artifacts..."

          # ----------------------------------------------------------
          # Windows
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then

            find src-tauri/target/release/bundle \
              -type f \
              \( \
                -name '*.exe' \
                -o -name '*.nsis.zip' \
                -o -name '*.nsis.zip.sig' \
              \) \
              -exec cp {} release/ \;

          fi

          # ----------------------------------------------------------
          # macOS
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "darwin-aarch64" ]; then

            find src-tauri/target/release/bundle \
              -type f \
              \( \
                -name '*.app.tar.gz' \
                -o -name '*.app.tar.gz.sig' \
              \) \
              -exec cp {} release/ \;

          fi

          # ----------------------------------------------------------
          # Linux
          # ----------------------------------------------------------

          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then

            find src-tauri/target/release/bundle \
              -type f \
              \( \
                -name '*.deb' \
                -o -name '*.rpm' \
                -o -name '*.AppImage' \
                -o -name '*.AppImage.sig' \
              \) \
              -exec cp {} release/ \;

          fi

          echo ""
          echo "Files prepared for artifact transfer:"
          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ------------------------------------------------------------
      # Upload ONLY selected files
      # ------------------------------------------------------------

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.platform }}
          path: release/*

  updater-manifest:
    name: Updater manifest
    needs:
      - resolve
      - build

    runs-on: ubuntu-24.04

    if: vars.TAURI_UPDATER_ENABLED == 'true' && needs.build.result != 'failure' && needs.build.result != 'cancelled'

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          path: src-tauri/updater/fragments
          pattern: updater-fragment-*
          merge-multiple: true

      - name: Merge updater manifest
        shell: bash
        env:
          TAURI_UPDATER_VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_UPDATER_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node scripts/gen-updater-manifest.mjs merge

      - name: Commit updater manifest
        if: github.ref_name == 'dev-v4.0.0'
        shell: bash
        run: |
          if ! git diff --quiet -- src-tauri/updater/latest.json; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add src-tauri/updater/latest.json

            git commit \
              -m "обновление манифеста автообновления до ${{ needs.resolve.outputs.version }}"

            git push
          fi

      - name: Upload updater manifest
        uses: actions/upload-artifact@v6
        with:
          name: updater-manifest
          path: src-tauri/updater/latest.json

  draft-release:
    name: Draft release
    needs:
      - resolve
      - build
      - updater-manifest

    runs-on: ubuntu-24.04

    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.updater-manifest.result != 'failure'

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # Download ONLY selected release files
      # ------------------------------------------------------------

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      # ------------------------------------------------------------
      # Download updater manifest
      # ------------------------------------------------------------

      - name: Download updater manifest
        if: needs.updater-manifest.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: updater-manifest
          path: manifest

      # ------------------------------------------------------------
      # Prepare final GitHub Release files
      # ------------------------------------------------------------

      - name: Prepare final release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          # ----------------------------------------------------------
          # Public installers / updater archives
          # ----------------------------------------------------------

          find bundles \
            -type f \
            \( \
              -name '*.exe' \
              -o -name '*.nsis.zip' \
              -o -name '*.app.tar.gz' \
              -o -name '*.deb' \
              -o -name '*.rpm' \
              -o -name '*.AppImage' \
            \) \
            -exec cp {} release/ \;

          # ----------------------------------------------------------
          # Updater manifest
          # ----------------------------------------------------------

          if [ -f manifest/latest.json ]; then
            cp manifest/latest.json release/latest.json
          fi

          echo ""
          echo "FINAL GITHUB RELEASE FILES:"
          echo ""

          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo ""
          echo "Total files:"

          find release \
            -maxdepth 1 \
            -type f \
            | wc -l

      # ------------------------------------------------------------
      # Remove previous draft
      # ------------------------------------------------------------

      - name: Remove previous draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиза $TAG ещё нет"
            exit 0
          fi

          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Релиз $TAG уже опубликован — не трогаю"
            exit 0
          fi

          echo "Удаляю старый draft release $TAG"

          gh release delete "$TAG" \
            --yes \
            --cleanup-tag

      # ------------------------------------------------------------
      # Create GitHub Draft Release
      # ------------------------------------------------------------

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}

          name: YASSH Client ${{ needs.resolve.outputs.version }} (dev-v4.0.0, draft)

          draft: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}

          prerelease: true

          target_commitish: ${{ github.sha }}

          fail_on_unmatched_files: false

          body: |
            Черновая сборка ветки `dev-v4.0.0` (Tauri 2 + Rust).

            Релиз намеренно остаётся черновиком: артефакты не публикуются,
            пока миграция не подтверждена.

            Автообновление:
            - Windows — NSIS updater
            - macOS — `.app.tar.gz`
            - Linux — AppImage

            Манифест автообновления:
            `src-tauri/updater/latest.json`

          files: |
            release/*.exe
            release/*.nsis.zip
            release/*.app.tar.gz
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/latest.json